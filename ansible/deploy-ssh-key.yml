---
- name: Deploy SSH Key to Hosts
  hosts: "{{ target_hosts }}"
  become: true
  serial: 1
  vars_prompt:
    - name: target_hosts
      prompt: "Enter target hosts or group (e.g., docker_vms, all, or specific hostname)"
      private: false
    - name: ssh_key_path
      prompt: "Enter path to SSH public key file (e.g., ~/.ssh/id_rsa.pub)"
      private: false

  tasks:
    - name: Deploy SSH public key to authorized_keys
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        state: present
        key: "{{ lookup('file', ssh_key_path) }}"
        exclusive: false
