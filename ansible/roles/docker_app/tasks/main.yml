---
- name: "Ensure directory exists for {{ docker_app_name }}"
  ansible.builtin.file:
    path: "{{ docker_base_path }}/{{ docker_app_name }}"
    state: directory
    owner: "{{ docker_app_owner | default(ansible_user) }}"
    group: "{{ docker_app_group | default(ansible_user) }}"
    mode: "0755"
- name: "Ensure data subdirectory exists for {{ docker_app_name }}"
  ansible.builtin.file:
    path: "{{ docker_base_path }}/{{ docker_app_name }}/data"
    state: directory
    owner: "{{ docker_app_owner | default(ansible_user) }}"
    group: "{{ docker_app_group | default(ansible_user) }}"
    mode: "0755"
- name: "Ensure subdirectories under data exist for {{ docker_app_name }}"
  ansible.builtin.file:
    path: "{{ docker_base_path }}/{{ docker_app_name }}/data/{{ item }}"
    state: directory
    owner: "{{ docker_app_owner | default(ansible_user) }}"
    group: "{{ docker_app_group | default(ansible_user) }}"
    mode: "0755"
  loop: "{{ docker_app_data_dirs | default([]) }}"
  when: docker_app_data_dirs is defined
- name: "Deploy config files for {{ docker_app_name }}"
  ansible.builtin.copy:
    src: "files/{{ item.src }}"
    dest: "{{ docker_base_path }}/{{ docker_app_name }}/data/{{ item.dest }}"
    owner: "{{ docker_app_owner | default(ansible_user) }}"
    group: "{{ docker_app_group | default(ansible_user) }}"
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ docker_app_config_files | default([]) }}"
  when: docker_app_config_files is defined
- name: "Deploy config templates {{ docker_app_name }}"
  ansible.builtin.template:
    src: "{{ docker_app_name }}/{{ item.src }}"
    dest: "{{ docker_base_path }}/{{ docker_app_name }}/data/{{ item.dest }}"
    owner: "{{ docker_app_owner | default(ansible_user) }}"
    group: "{{ docker_app_group | default(ansible_user) }}"
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ docker_app_config_templates | default([]) }}"
  when: docker_app_config_templates is defined
- name: "Deploy docker-compose for {{ docker_app_name }}"
  ansible.builtin.template:
    src: "{{ docker_app_name }}/docker-compose.yml.j2"
    dest: "{{ docker_base_path }}/{{ docker_app_name }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
- name: "Start {{ docker_app_name }}"
  community.docker.docker_compose_v2:
    project_src: "{{ docker_base_path }}/{{ docker_app_name }}"
    state: present
    pull: "always"
    recreate: "auto"
  become: true
  become_user: "{{ ansible_user }}"
