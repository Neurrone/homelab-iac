---
- name: Reload ssh
  ansible.builtin.service:
    name: ssh
    state: reloaded

- name: Restart nftables
  ansible.builtin.service:
    name: nftables
    state: restarted

- name: Apply sysctl settings
  ansible.builtin.command:
    argv:
      - sysctl
      - --system
  changed_when: true

- name: Restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: Restart auditd
  ansible.builtin.service:
    name: auditd
    state: restarted
