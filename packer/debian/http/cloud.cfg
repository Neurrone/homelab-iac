# cloud-init drop-in for template defaults.
# Per-VM credentials (username/password/keys) should be injected at clone time.

manage_etc_hosts: true
users:
  - default

system_info:
  default_user:
    sudo: ["ALL=(ALL:ALL) ALL"]

disable_root: true
ssh_pwauth: false

apt_update: true
apt_upgrade: true
apt_reboot_if_required: true

packages:
  - vim
  - curl
